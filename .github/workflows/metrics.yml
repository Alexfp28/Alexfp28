name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/readme-images-not-displaying-ovpbc6

permissions:
  contents: write

# Two runs committing to the metrics branch at once would fight over it.
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # isocalendar runs its own contributions query, so it needs no base data.
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Deliberately last: step logs are only readable from the tail of the
      # job log, and this is the card still being diagnosed (languages
      # renders as "0 Languages" for reasons not yet established).
      - name: Stats card
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-stats.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
