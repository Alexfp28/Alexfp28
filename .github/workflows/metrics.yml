name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/readme-images-not-displaying-ovpbc6

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-stats.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Top languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-achievements.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
