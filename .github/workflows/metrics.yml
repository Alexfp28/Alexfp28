name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/readme-images-not-displaying-ovpbc6

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Languages and achievements are derived from the base repositories
      # content, so they have to live on the card that enables it. Rendering
      # them with `base: ""` produced "0 Languages" and an error card.
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-stats.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      # isocalendar runs its own contributions query, so it needs no base data.
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
