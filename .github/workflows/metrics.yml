name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/readme-images-not-displaying-ovpbc6

permissions:
  contents: write

# Two runs committing to the metrics branch at once would fight over it.
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # isocalendar runs its own contributions query, so it needs no base data.
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Stats card
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-stats.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base

      # The default most-used path reports "0 Languages" even with base
      # repositories data present and nothing ignored or skipped, so this uses
      # indepth mode instead: it clones the repositories and analyses them
      # locally rather than relying on the GraphQL languages field. Isolated
      # and non-blocking, and not referenced from the README until it renders.
      - name: Top languages (isolated)
        uses: lowlighter/metrics@latest
        timeout-minutes: 15
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alexfp28
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
